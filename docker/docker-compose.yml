# The OpenEPCIS Community Edition: OpenSearch, Kafka, the topics the pipeline needs, and the
# service. Development and evaluation setup: OpenSearch without its security plugin, Kafka in
# plaintext, all data visible to every authenticated caller. Put a reverse proxy with TLS in
# front before anyone outside your network can reach it.
#
#   export OPENEPCIS_ADMIN_PASSWORD="$(openssl rand -base64 24)"
#   docker compose up -d
#
services:
  opensearch:
    image: docker.io/opensearchproject/opensearch:2.19.2
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kafka:
    image: docker.io/apache/kafka:3.8.0
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  # The service creates no topics; the Kafka Streams topology waits for them. One-shot.
  kafka-setup:
    image: docker.io/apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in epcis-event-captured capture-documents capture-documents-agg \
                     capture-document-event capture-document-event-count capture-document-event-error \
                     epcis-event-validated epcis-event-validated-success epcis-event-validated-failure \
                     epcis-event-persisted event-saved websocket-subscription streaming-subscription; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --partitions 1 --replication-factor 1 --topic "$$topic"
        done

  epcis-repository:
    image: ghcr.io/openepcis/openepcis-quarkus-rest-api-ce:0.9.4
    depends_on:
      opensearch:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    environment:
      # passed through from the shell; without it the service refuses to start
      - OPENEPCIS_ADMIN_PASSWORD
      - QUARKUS_OPENSEARCH_HOSTS=opensearch:9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - STORAGE_LOCAL_PATH=/data/openepcis
    volumes:
      - epcis-store:/data/openepcis
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  opensearch-data:
  kafka-data:
  epcis-store:
