# Deployment defaults of the image. Everything the service does is configured in the
# application.yml of io.openepcis:quarkus-rest-application; the environment variables it reads
# are listed in the README.
quarkus:
  application:
    name: openepcis-quarkus-rest-api-ce
  http:
    host: 0.0.0.0
  jib:
    base-jvm-image: ghcr.io/graalvm/jdk-community:25
    platforms: linux/amd64,linux/arm64
    jvm-arguments:
      - -Dio.openepcis.digitallink.utils.DefaultGCPLengthProvider.defaultGcpLength=9
